[package]
name = "cliip-show"
version = "0.7.0"
edition = "2021"
# crates.io には公開しない（cargo release の publish ステップも抑止する）
publish = false

[dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding", "relax-void-encoding"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSRange", "NSString"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-segmentation = "1"

# 設定ウィンドウのビューツリー検査。NSWindow はメインスレッドでしか生成できず、
# libtest はテストをワーカースレッドで走らせるため、自前の main で実行する
[[test]]
name = "settings_window_view_tree"
harness = false
