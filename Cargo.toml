[package]
name = "cliip-show"
version = "0.5.3"
edition = "2021"

[dependencies]
objc2 = { version = "0.5", features = ["relax-sign-encoding", "relax-void-encoding"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSRange", "NSString"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-segmentation = "1"
